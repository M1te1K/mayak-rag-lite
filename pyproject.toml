[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mayak-rag-lite"
version = "0.1.0"
description = "CLI assistant with local multilingual PDF retrieval and grounded answers"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.28,<0.29", "python-dotenv>=1.1,<2", "pypdf>=6,<7",
  "numpy>=2.2,<3", "sentence-transformers>=5.1,<6", "transformers>=4.51,<5",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "reportlab>=4.4,<5", "ruff>=0.13,<1"]

[project.scripts]
mayak = "mayak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real local embeddings; no LLM API calls"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
